name: Patch Mapbox camera

on:
  push:
    branches:
      - feature/add-mapbox-basemaps-and-3d

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/add-mapbox-basemaps-and-3d
      - name: Include rotation in interaction state
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/src/App.tsx')
          text = path.read_text()
          old = 'onInteractionStateChange={interactionState => setMapInteracting(Boolean(interactionState.isDragging || interactionState.isPanning || interactionState.isZooming))} onViewStateChange={({ viewState, interactionState }) => {\n        if (!interactionState.isDragging && !interactionState.isPanning && !interactionState.isZooming) return;'
          new = 'onInteractionStateChange={interactionState => setMapInteracting(Boolean(interactionState.isDragging || interactionState.isPanning || interactionState.isRotating || interactionState.isZooming))} onViewStateChange={({ viewState, interactionState }) => {\n        if (!interactionState.isDragging && !interactionState.isPanning && !interactionState.isRotating && !interactionState.isZooming) return;'
          count = text.count(old)
          if count != 1:
            raise SystemExit(f'expected exactly one interaction-state match, found {count}')
          path.write_text(text.replace(old, new))
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/App.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: track 3d camera rotation interactions"
          git push origin HEAD:feature/add-mapbox-basemaps-and-3d
