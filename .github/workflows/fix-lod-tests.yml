name: Fix LOD test expectations

on:
  push:
    branches: [feat/tolerance-render-pyramid]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/tolerance-render-pyramid
      - name: Update tests for tolerance LODs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing marker in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'apps/web/src/engine.test.ts',
              'import { BrowserDuckDBEngine, cacheBudget, lodForZoom } from "./engine";\n',
              'import { BrowserDuckDBEngine, cacheBudget } from "./engine";\nimport { lodForZoom } from "./lod";\n',
          )
          replace(
              'apps/web/src/engine.test.ts',
              'expect([7.99, 8, 11.99, 12, 13.99, 14, 15.99, 16].map(lodForZoom)).toEqual([0, 1, 1, 2, 2, 3, 3, 4]);',
              'expect([6.99, 7, 8.99, 9, 10.99, 11, 12.99, 13].map(zoom => lodForZoom(zoom, "medium"))).toEqual([0, 1, 1, 2, 2, 3, 3, 4]);',
          )
          replace(
              'apps/web/src/engine.test.ts',
              'await engine.execute(tab, 12.5, [-106, 39, -104, 41]);\n    const result = await engine.renderViewport(13.5, [-105.5, 39.5, -104.5, 40.5]);',
              'await engine.execute(tab, 13.25, [-106, 39, -104, 41]);\n    const result = await engine.renderViewport(13.75, [-105.5, 39.5, -104.5, 40.5]);',
          )
          replace(
              'apps/web/src/App.test.tsx',
              'expect(screen.getByRole("button", { name: `Change dataset · ${datasetId}` })).toBeInTheDocument();',
              'expect(screen.getByRole("button", { name: "Change dataset" })).toBeInTheDocument();\n    expect(screen.queryByText(datasetId)).not.toBeInTheDocument();',
          )
          replace(
              'packages/ingest/tests/test_ingest.py',
              '    assert [level["lod"] for level in manifest["render_levels"]] == list(range(5))\n',
              '    assert [level["lod"] for level in manifest["render_levels"]] == list(range(8))\n',
          )
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/engine.test.ts apps/web/src/App.test.tsx packages/ingest/tests/test_ingest.py
          git commit -m 'test: align expectations with tolerance lods'
          git push
