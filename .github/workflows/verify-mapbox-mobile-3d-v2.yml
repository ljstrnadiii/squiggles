name: Verify simplified Mapbox mobile 3D
on:
  push:
    branches: [fix/rigorous-mapbox-mobile-3d]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rigorous-mapbox-mobile-3d
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/App.tsx'); s=p.read_text()
          s=s.replace('import { _TerrainExtension as TerrainExtension } from "@deck.gl/extensions";\n','').replace('import { TerrainLayer } from "@deck.gl/geo-layers";\n','')
          rgb='''const mapboxTerrainRgbTiles = mapboxAccessToken ? `https://api.mapbox.com/v4/mapbox.terrain-rgb/{z}/{x}/{y}.pngraw?access_token=${mapboxAccessToken}` : null;\nconst terrainTiles = mapboxTerrainRgbTiles ?? fallbackTerrainTiles;\nconst terrainDecoder = mapboxTerrainRgbTiles\n  ? { rScaler: 6553.6, gScaler: 25.6, bScaler: 0.1, offset: -10000 }\n  : { rScaler: 256, gScaler: 1, bScaler: 1 / 256, offset: -32768 };\n'''
          if s.count(rgb)!=1: raise SystemExit('terrain RGB constants mismatch')
          s=s.replace(rgb,'')
          old='''  async function openSource(source: DatasetSource, requestedView?: MapState, initialTab = tab) {\n    try {\n      setBusy(true); setError(\"\"); setStatus(\"Reading dataset manifest…\");\n      const dataset = await engine.openDataset(source, (completed, total) => setStatus(`Opening dataset · ${completed.toLocaleString()} / ${total.toLocaleString()} files`));\n      ready.current = true; setDatasetName(dataset.name);\n      const initialView = requestedView ?? fitBounds(dataset.manifest.bbox);\n      setView(initialView);'''
          new='''  async function openSource(source: DatasetSource, requestedView?: MapState, initialTab = tab) {\n    const openingView = viewRef.current;\n    try {\n      setBusy(true); setError(\"\"); setStatus(\"Reading dataset manifest…\");\n      const dataset = await engine.openDataset(source, (completed, total) => setStatus(`Opening dataset · ${completed.toLocaleString()} / ${total.toLocaleString()} files`));\n      ready.current = true; setDatasetName(dataset.name);\n      const latestView = viewRef.current;\n      const moved = Math.abs(latestView.longitude-openingView.longitude)>1e-7 || Math.abs(latestView.latitude-openingView.latitude)>1e-7 || Math.abs(latestView.zoom-openingView.zoom)>1e-7 || Math.abs(latestView.bearing-openingView.bearing)>1e-7 || Math.abs(latestView.pitch-openingView.pitch)>1e-7;\n      const fitted = fitBounds(dataset.manifest.bbox);\n      const initialView = requestedView ?? (moved ? latestView : initialTab.style.viewMode === \"3d\" ? { ...fitted, bearing: openingView.bearing, pitch: openingView.pitch > 0 ? openingView.pitch : 50 } : fitted);\n      setView(initialView);'''
          if s.count(old)!=1: raise SystemExit('openSource mismatch')
          s=s.replace(old,new)
          terrain='''  const terrainExtension = useMemo(() => new TerrainExtension(), []);\n  const terrainSource = useMemo(() => tab.style.viewMode === "3d" ? new TerrainLayer({ id: "terrain-source", elevationData: terrainTiles, elevationDecoder: terrainDecoder, minZoom: 0, maxZoom: 14, strategy: "no-overlap", operation: "terrain" }) : null, [tab.style.viewMode]);\n  const terrainExtensions = useMemo(() => terrainSource ? [terrainExtension] : [], [terrainExtension, terrainSource]);\n  const layers = useMemo(() => [\n    ...(terrainSource ? [terrainSource] : []),'''
          if s.count(terrain)!=1: raise SystemExit('terrain layer block mismatch')
          s=s.replace(terrain,'  const layers = useMemo(() => [')
          s=s.replace('extensions: terrainExtensions, widthUnits:', 'widthUnits:')
          s=s.replace('tab.style.heatEnabled, terrainExtensions, terrainSource]);','tab.style.heatEnabled]);')
          p.write_text(s)
          PY
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - name: Build test app
        env:
          VITE_DATASET_BASE_URL: https://squiggles.io/datasets
        run: pnpm --filter @squiggles/web build
      - name: Browser assertions
        env:
          DATASET_ID: 97d948ec-47c1-435a-add9-65eee580fa49
        run: |
          python -m pip install playwright==1.55.0 pillow >/dev/null
          pnpm --filter @squiggles/web exec vite preview --host 127.0.0.1 --port 4173 >/tmp/vite.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python - <<'PY'
          import base64,io,os,time
          from PIL import Image
          from playwright.sync_api import sync_playwright
          ds=os.environ['DATASET_ID']; base=f'http://127.0.0.1:4173/m/{ds}'
          def route_pixels(raw):
            im=Image.open(io.BytesIO(raw)).convert('RGB')
            return sum(1 for r,g,b in im.getdata() if r>170 and r>g*1.25 and r>b*1.15)
          with sync_playwright() as p:
            b=p.chromium.launch(channel='chrome',headless=True); counts={}
            for mode,pitch in [('2d',0),('3d',50)]:
              c=b.new_context(viewport={'width':430,'height':932},device_scale_factor=2,is_mobile=True,has_touch=True); page=c.new_page(); errs=[]; page.on('pageerror',lambda e:errs.append(str(e)))
              page.goto(f'{base}?lng=-105.2705&lat=40.0150&zoom=11&bearing=0&pitch={pitch}&basemap=carto-light&view={mode}&heat=0&color=%23ff0000',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function("() => (document.querySelector('.status')?.getAttribute('aria-label')||'').includes('routes selected')",timeout=70000); page.wait_for_timeout(1500)
              assert 'zoom=11.' in page.url,page.url
              if mode=='3d': assert 'pitch=50' in page.url,page.url
              cdp=c.new_cdp_session(page); raw=base64.b64decode(cdp.send('Page.captureScreenshot',{'format':'png','fromSurface':True})['data']); counts[mode]=route_pixels(raw)
              rect=page.locator('.maplibre-base').bounding_box(); x=rect['x']+rect['width']/2; y=rect['y']+rect['height']/2; before=page.url
              pts=[{'x':x-40,'y':y+20,'radiusX':5,'radiusY':5,'force':1,'id':1},{'x':x+40,'y':y+20,'radiusX':5,'radiusY':5,'force':1,'id':2}]; cdp.send('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':pts})
              for dy in (15,30,45,60): cdp.send('Input.dispatchTouchEvent',{'type':'touchMove','touchPoints':[dict(pts[0],y=y+20-dy),dict(pts[1],y=y+20-dy)]}); time.sleep(.04)
              cdp.send('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]}); page.wait_for_timeout(500)
              if mode=='3d': assert page.url!=before,(before,page.url)
              assert not errs,errs; c.close()
            print('ROUTE_PIXELS',counts); assert counts['2d']>5 and counts['3d']>5 and counts['3d']>counts['2d']*.1,counts
            c=b.new_context(viewport={'width':430,'height':932},device_scale_factor=2,is_mobile=True,has_touch=True); page=c.new_page(); page.goto(base,wait_until='domcontentloaded',timeout=30000); page.wait_for_selector('.maplibre-base',timeout=10000)
            rect=page.locator('.maplibre-base').bounding_box(); page.mouse.move(rect['x']+rect['width']/2,rect['y']+rect['height']/2); page.mouse.wheel(0,-900); page.wait_for_timeout(250); moved=page.url
            page.wait_for_function("() => (document.querySelector('.status')?.getAttribute('aria-label')||'').includes('routes selected')",timeout=70000); page.wait_for_timeout(400); final=page.url
            print('STARTUP',moved,final); assert moved!=base and 'zoom=1.00' not in final,final
            c.close(); b.close()
          PY
      - name: Commit verified app change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/App.tsx
          git commit -m "fix: stabilize startup camera and 3D route rendering"
          git push origin HEAD:fix/rigorous-mapbox-mobile-3d
