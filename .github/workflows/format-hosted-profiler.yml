name: Format hosted profiler

on:
  push:
    branches: [fix/perf-regressions]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-profiler]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/perf-regressions
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run --frozen ruff format scripts/profile_hosted_browser.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/profile_hosted_browser.py
          git commit -m "style: format hosted profiler [format-profiler]"
          git push origin HEAD:fix/perf-regressions
