name: Fix worker timing instrumentation (temporary)

on:
  push:
    branches: [perf/worker-open-timings]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deduplicate timing declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/duckdb.worker.ts')
          text = path.read_text()
          triple = '''  const selectStarted = performance.now();\n  const selectStarted = performance.now();\n  const selectStarted = performance.now();\n  const bundle = await duckdb.selectBundle(bundles);\n  const selectBundleMs = performance.now() - selectStarted;\n  const selectBundleMs = performance.now() - selectStarted;\n  const selectBundleMs = performance.now() - selectStarted;\n'''
          single = '''  const selectStarted = performance.now();\n  const bundle = await duckdb.selectBundle(bundles);\n  const selectBundleMs = performance.now() - selectStarted;\n'''
          if triple not in text:
              raise SystemExit('duplicate timing block not found')
          path.write_text(text.replace(triple, single, 1))
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/duckdb.worker.ts
          git commit -m "fix: deduplicate worker timing declarations"
          git push
