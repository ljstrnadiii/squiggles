name: Patch dismissible panels
on:
  push:
    branches: [fix/dismissible-mobile-panels]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dismissible-mobile-panels
      - name: Add dismiss controls and mobile account bounds
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('apps/web/src/App.tsx')
          t=p.read_text()
          old='''{error && <div className="error global-error"><strong>Something needs attention</strong><span>{error}</span></div>}'''
          new='''{error && <div className="error global-error"><strong>Something needs attention</strong><span>{error}</span><button aria-label="Dismiss error" onClick={() => setError("")}>×</button></div>}'''
          if old not in t: raise SystemExit('global error marker not found')
          p.write_text(t.replace(old,new,1))

          p=Path('apps/web/src/styles.css')
          t=p.read_text()
          old='''.global-error {\n  position: fixed;\n  z-index: 20;\n  top: 58px;\n  left: 50%;\n  max-width: min(760px, calc(100vw - 24px));\n  transform: translateX(-50%);\n  border-radius: 7px;\n  box-shadow: 0 8px 30px var(--shadow);\n}'''
          new='''.global-error {\n  position: fixed;\n  z-index: 20;\n  top: 58px;\n  left: 50%;\n  max-width: min(760px, calc(100vw - 24px));\n  transform: translateX(-50%);\n  border-radius: 7px;\n  box-shadow: 0 8px 30px var(--shadow);\n}\n.global-error button {\n  flex: none;\n  margin-left: auto;\n  padding: 0 4px;\n  border: 0;\n  background: transparent;\n  color: inherit;\n  font-size: 18px;\n  line-height: 1;\n}'''
          if old not in t: raise SystemExit('global error css marker not found')
          t=t.replace(old,new,1)
          marker='''.account-panel p { margin: 0; line-height: 1.5; color: var(--muted); }'''
          replacement='''.account-panel { overflow-y: auto; }\n.account-panel > header { position: sticky; top: 0; z-index: 2; background: var(--panel); }\n.account-panel p { margin: 0; line-height: 1.5; color: var(--muted); }'''
          if marker not in t: raise SystemExit('account panel css marker not found')
          t=t.replace(marker,replacement,1)
          mobile='''  .system-settings {\n    top: auto;\n    left: 0;\n    right: 0;\n    bottom: 0;\n    width: 100%;'''
          mobile_new='''  .system-settings {\n    top: auto;\n    left: 0;\n    right: 0;\n    bottom: 0;\n    width: 100%;'''
          if mobile not in t: raise SystemExit('mobile system settings marker not found')
          # AccountPanel inherits the bottom-sheet system settings rules; cap it to the visible viewport.
          insert='''  .account-panel {\n    max-height: calc(100dvh - 50px);\n  }\n'''
          location='''  .schema-panel {'''
          idx=t.find(location, t.find('@media (max-width: 600px)'))
          if idx < 0: raise SystemExit('mobile schema marker not found')
          t=t[:idx]+insert+t[idx:]
          p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/App.tsx apps/web/src/styles.css
          git commit -m 'fix: make errors and mobile account dismissible'
          git push
