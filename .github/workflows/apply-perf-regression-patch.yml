name: Apply performance regression patch

on:
  push:
    branches: [fix/perf-regressions]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[perf-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/perf-regressions
      - name: Apply patch
        run: python scripts/apply_perf_regression_patch.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/App.test.tsx apps/web/src/storage.performance.test.ts
          git commit -m "test: cover demand-driven summary [perf-patch]"
          git push origin HEAD:fix/perf-regressions
