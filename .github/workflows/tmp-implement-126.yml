name: temp-implement-126
on:
  push:
    branches: [feat/issue-126-map-settings-polish]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-126-map-settings-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply issue 126 polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new))

          replace('apps/web/src/contracts.ts',
              'export type Basemap = "streets" | "topo" | "imagery" | "blank";',
              'export type Basemap = "carto-light" | "carto-dark" | "streets" | "topo" | "imagery" | "blank";')

          replace('apps/web/src/App.tsx',
              'const rasterStyles: Record<Exclude<Basemap, "blank">, { tiles: string[]; attribution: string; maxzoom: number }> = {\n  streets: { tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], attribution: "© OpenStreetMap contributors", maxzoom: 19 },',
              'const rasterStyles: Record<Exclude<Basemap, "blank">, { tiles: string[]; attribution: string; maxzoom: number }> = {\n  "carto-light": { tiles: ["https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png"], attribution: "© OpenStreetMap contributors © CARTO", maxzoom: 20 },\n  "carto-dark": { tiles: ["https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png"], attribution: "© OpenStreetMap contributors © CARTO", maxzoom: 20 },\n  streets: { tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], attribution: "© OpenStreetMap contributors", maxzoom: 19 },')

          replace('apps/web/src/App.tsx',
              'const basemaps = new Set<Basemap>(["streets", "topo", "imagery", "blank"]);',
              'const basemaps = new Set<Basemap>(["carto-light", "carto-dark", "streets", "topo", "imagery", "blank"]);')

          replace('apps/web/src/App.tsx',
              '<label data-tooltip="Choose streets, topographic, imagery, or a fully offline map.">Basemap<select aria-label="Basemap" value={tab.style.basemap} onChange={event => changeStyle({ basemap: event.target.value as Basemap })}><option value="streets">Streets</option><option value="topo">Topographic</option><option value="imagery">Imagery</option><option value="blank">Blank / offline</option></select></label>',
              '<label data-tooltip="Choose a subdued CARTO map for maximum route contrast, or switch to streets, topographic, imagery, or offline.">Basemap<select className="basemap-select" aria-label="Basemap" value={tab.style.basemap} onChange={event => changeStyle({ basemap: event.target.value as Basemap })}><option value="carto-light">CARTO Light</option><option value="carto-dark">CARTO Dark</option><option value="streets">Streets</option><option value="topo">Topographic</option><option value="imagery">Imagery</option><option value="blank">Blank / offline</option></select></label>')

          replace('apps/web/src/App.tsx',
              '      </div></section>\n      <section className="toolbar-section"><h3>Heat</h3>',
              '      </div><p className="network-note">Wi‑Fi recommended for the best experience with remote archives and basemaps.</p></section>\n      <section className="toolbar-section"><h3>Heat</h3>')

          replace('apps/web/src/App.test.tsx', 'basemap=imagery&heat=0', 'basemap=carto-dark&heat=0')
          replace('apps/web/src/App.test.tsx', 'style: { basemap: "imagery" }', 'style: { basemap: "carto-dark" }')

          replace('apps/web/src/styles.css',
              '.toolbar select {\n  width: 100%;\n  padding: 5px 22px 5px 6px;',
              '.toolbar select {\n  width: 100%;\n  padding: 5px 22px 5px 6px;')
          p = Path('apps/web/src/styles.css')
          css = p.read_text()
          anchor = '.toolbar input[type="color"] {'
          insert = '.toolbar .basemap-select {\n  appearance: none;\n  -webkit-appearance: none;\n  padding-right: 6px;\n}\n.network-note {\n  margin: 10px 0 0;\n  color: var(--muted);\n  font-size: 9px;\n  line-height: 1.4;\n}\n'
          if insert not in css:
              if anchor not in css: raise SystemExit('missing css insertion anchor')
              css = css.replace(anchor, insert + anchor)
          css = css.replace('.toolbar .temperature {\n  display: grid;', '.toolbar .temperature {\n  grid-column: 1 / -1;\n  display: grid;')
          css = css.replace('  .temperature input {\n    width: 62px;\n  }', '  .temperature input {\n    width: 100%;\n    min-width: 0;\n  }')
          css = css.replace('  .toolbar {\n    top: auto;\n    left: 0;', '  .toolbar {\n    top: 0;\n    left: 0;')
          p.write_text(css)

          Path('.github/workflows/tmp-implement-126.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(web): polish map settings and basemaps"
          git push origin HEAD:feat/issue-126-map-settings-polish
