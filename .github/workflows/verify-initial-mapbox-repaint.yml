name: Verify initial Mapbox repaint
on:
  push:
    branches: [fix/initial-mapbox-repaint]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/initial-mapbox-repaint
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - name: Read deployed public Mapbox token
        run: |
          python - <<'PY'
          import os, re, urllib.request
          index = urllib.request.urlopen('https://squiggles.io/', timeout=30).read().decode()
          scripts = re.findall(r'<script[^>]+src="([^"]+\.js)"', index)
          app_scripts = [src for src in scripts if '/assets/index-' in src]
          if not app_scripts:
              raise SystemExit(f'No deployed Vite app bundle found: {scripts}')
          bundle_url = urllib.request.urljoin('https://squiggles.io/', app_scripts[0])
          bundle = urllib.request.urlopen(bundle_url, timeout=30).read().decode()
          match = re.search(r'pk\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', bundle)
          if not match:
              raise SystemExit('No deployed Mapbox public token found')
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'VITE_MAPBOX_ACCESS_TOKEN={match.group(0)}\n')
          print('Loaded deployed public Mapbox token')
          PY
      - name: Build with production Mapbox path
        env:
          VITE_DATASET_BASE_URL: https://squiggles.io/datasets
        run: pnpm --filter @squiggles/web build
      - name: Assert first pitched frame paints routes
        env:
          DATASET_ID: 97d948ec-47c1-435a-add9-65eee580fa49
        run: |
          python -m pip install playwright==1.55.0 pillow >/dev/null
          pnpm --filter @squiggles/web exec vite preview --host 127.0.0.1 --port 4173 >/tmp/vite.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          python - <<'PY'
          import base64, io, os, time
          from PIL import Image
          from playwright.sync_api import sync_playwright
          ds=os.environ['DATASET_ID']
          base=f'http://127.0.0.1:4173/m/{ds}'
          def pixels(raw):
              im=Image.open(io.BytesIO(raw)).convert('RGB')
              return sum(1 for r,g,b in im.getdata() if r>170 and r>g*1.25 and r>b*1.15)
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome', headless=True)
              context=browser.new_context(viewport={'width':430,'height':932},device_scale_factor=2,is_mobile=True,has_touch=True)
              page=context.new_page()
              cdp=context.new_cdp_session(page)
              cdp.send('Network.enable')
              cdp.send('Network.setCacheDisabled', {'cacheDisabled': True})
              url=(f'{base}?cachebust={time.time_ns()}&lng=-105.2705&lat=40.0150&zoom=11&bearing=0&pitch=50'
                   '&basemap=mapbox-standard&view=3d&heat=0&color=%23ff0000')
              page.goto(url, wait_until='domcontentloaded', timeout=30000)
              page.wait_for_function("() => (document.querySelector('.status')?.getAttribute('aria-label') || '').includes('routes selected')", timeout=70000)
              page.wait_for_timeout(1500)
              before=page.url
              raw=base64.b64decode(cdp.send('Page.captureScreenshot', {'format':'png','fromSurface':True})['data'])
              count=pixels(raw)
              print('INITIAL_3D_ROUTE_PIXELS', count)
              print('INITIAL_URL', before)
              assert 'pitch=50' in before, before
              assert count>5, count
              rect=page.locator('.maplibre-base').bounding_box(); x=rect['x']+rect['width']/2; y=rect['y']+rect['height']/2
              pts=[{'x':x-40,'y':y+20,'radiusX':5,'radiusY':5,'force':1,'id':1},{'x':x+40,'y':y+20,'radiusX':5,'radiusY':5,'force':1,'id':2}]
              cdp.send('Input.dispatchTouchEvent', {'type':'touchStart','touchPoints':pts})
              for dy in (15,30,45,60):
                  cdp.send('Input.dispatchTouchEvent', {'type':'touchMove','touchPoints':[dict(pts[0],y=y+20-dy),dict(pts[1],y=y+20-dy)]}); time.sleep(.04)
              cdp.send('Input.dispatchTouchEvent', {'type':'touchEnd','touchPoints':[]})
              page.wait_for_timeout(500)
              print('AFTER_TOUCH_URL', page.url)
              assert page.url != before, (before,page.url)
              context.close(); browser.close()
          PY
