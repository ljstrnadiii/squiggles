name: Patch real 3D terrain

on:
  push:
    branches:
      - fix/real-3d-touch-pitch

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/real-3d-touch-pitch
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add terrain dependencies
        run: pnpm --filter @squiggles/web add @deck.gl/geo-layers@9.3.10 @deck.gl/extensions@9.3.10
      - name: Apply terrain and touch patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('apps/web/src/App.tsx')
          text = p.read_text()

          def once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:140]!r}')
              text = text.replace(old, new)

          once(
              'import { PathLayer, ScatterplotLayer } from "@deck.gl/layers";\nimport DeckGL from "@deck.gl/react";',
              'import { _TerrainExtension as TerrainExtension } from "@deck.gl/extensions";\nimport { TerrainLayer } from "@deck.gl/geo-layers";\nimport { PathLayer, ScatterplotLayer } from "@deck.gl/layers";\nimport DeckGL from "@deck.gl/react";',
          )

          once(
              '  setLayoutProperty(layerId: string, name: "visibility", value: "visible" | "none"): void;\n  on(event: "style.load", listener: () => void): void;',
              '  setLayoutProperty(layerId: string, name: "visibility", value: "visible" | "none"): void;\n  addSource(id: string, source: { type: "raster-dem"; tiles: string[]; tileSize: number; maxzoom: number; encoding: "terrarium"; attribution: string }): void;\n  getSource(id: string): unknown;\n  setTerrain(terrain: { source: string; exaggeration: number } | null): void;\n  isStyleLoaded(): boolean;\n  on(event: "style.load", listener: () => void): void;',
          )

          once(
              'const mapboxAccessToken = (import.meta.env.VITE_MAPBOX_ACCESS_TOKEN as string | undefined)?.trim();',
              'const mapboxAccessToken = (import.meta.env.VITE_MAPBOX_ACCESS_TOKEN as string | undefined)?.trim();\nconst terrainTiles = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";\nconst terrainAttribution = "Elevation: Mapzen/Tilezen · AWS Open Data";',
          )

          marker = '\nfunction BaseMap({ view, basemap, options, theme }: { view: MapState; basemap: Basemap; options: BasemapOptions; theme: "light" | "dark" }) {'
          replacement = '''\nfunction applyTerrain(map: MapboxMapInstance, enabled: boolean) {\n  if (!enabled) { map.setTerrain(null); return; }\n  if (!map.getSource("squiggles-terrain")) {\n    map.addSource("squiggles-terrain", { type: "raster-dem", tiles: [terrainTiles], tileSize: 256, maxzoom: 15, encoding: "terrarium", attribution: terrainAttribution });\n  }\n  map.setTerrain({ source: "squiggles-terrain", exaggeration: 1 });\n}\n\nfunction BaseMap({ view, basemap, options, viewMode, theme }: { view: MapState; basemap: Basemap; options: BasemapOptions; viewMode: MapViewMode; theme: "light" | "dark" }) {'''
          once(marker, replacement)

          once(
              '  const initialOptions = useRef(options);\n  const appliedStyle = useRef(`${basemap}:${theme}:${JSON.stringify(options)}`);\n  const currentBasemap = useRef(basemap);\n  const currentOptions = useRef(options);\n  currentBasemap.current = basemap;\n  currentOptions.current = options;',
              '  const initialOptions = useRef(options);\n  const initialViewMode = useRef(viewMode);\n  const appliedStyle = useRef(`${basemap}:${theme}:${JSON.stringify(options)}`);\n  const currentBasemap = useRef(basemap);\n  const currentOptions = useRef(options);\n  const currentViewMode = useRef(viewMode);\n  currentBasemap.current = basemap;\n  currentOptions.current = options;\n  currentViewMode.current = viewMode;',
          )

          once(
              '    map.current.on("style.load", () => { if (map.current) applyBasemapOptions(map.current, currentBasemap.current, currentOptions.current); });',
              '    map.current.on("style.load", () => { if (map.current) { applyBasemapOptions(map.current, currentBasemap.current, currentOptions.current); applyTerrain(map.current, currentViewMode.current === "3d"); } });',
          )

          once(
              '  useLayoutEffect(() => {\n    map.current?.jumpTo({ center: [view.longitude, view.latitude], zoom: view.zoom, bearing: view.bearing ?? 0, pitch: view.pitch ?? 0 });\n  }, [view]);',
              '  useLayoutEffect(() => {\n    map.current?.jumpTo({ center: [view.longitude, view.latitude], zoom: view.zoom, bearing: view.bearing ?? 0, pitch: view.pitch ?? 0 });\n  }, [view]);\n  useEffect(() => {\n    if (map.current?.isStyleLoaded()) applyTerrain(map.current, viewMode === "3d");\n  }, [viewMode]);',
          )

          once(
              '  const layers = useMemo(() => [\n    ...spatialLayers(tab.spatialFilter, spatialDrawing, spatialDraft),',
              '  const terrainExtension = useMemo(() => new TerrainExtension(), []);\n  const terrainSource = useMemo(() => tab.style.viewMode === "3d" ? new TerrainLayer({ id: "terrain-source", elevationData: terrainTiles, elevationDecoder: { rScaler: 256, gScaler: 1, bScaler: 1 / 256, offset: -32768 }, minZoom: 0, maxZoom: 15, strategy: "no-overlap", operation: "terrain" }) : null, [tab.style.viewMode]);\n  const terrainExtensions = useMemo(() => terrainSource ? [terrainExtension] : [], [terrainExtension, terrainSource]);\n  const layers = useMemo(() => [\n    ...(terrainSource ? [terrainSource] : []),\n    ...spatialLayers(tab.spatialFilter, spatialDrawing, spatialDraft),',
          )

          # Drape every route PathLayer onto the terrain surface while 3D is active.
          text = text.replace('widthUnits: "pixels", widthMinPixels:', 'extensions: terrainExtensions, terrainDrawMode: "drape", widthUnits: "pixels", widthMinPixels:')
          text = text.replace('widthUnits: "pixels", widthMinPixels:', 'extensions: terrainExtensions, terrainDrawMode: "drape", widthUnits: "pixels", widthMinPixels:')

          # Add terrain dependencies to the layers memo dependency list.
          old = 'tab.spatialFilter, tab.style.color, tab.style.heatEnabled]);'
          new = 'tab.spatialFilter, tab.style.color, tab.style.heatEnabled, terrainExtensions, terrainSource]);'
          if old not in text:
              raise SystemExit('layers dependency marker not found')
          text = text.replace(old, new, 1)

          once(
              '<BaseMap view={view} basemap={tab.style.basemap} options={tab.style.basemapOptions} theme={effectiveTheme} />',
              '<BaseMap view={view} basemap={tab.style.basemap} options={tab.style.basemapOptions} viewMode={tab.style.viewMode} theme={effectiveTheme} />',
          )

          once(
              'onViewStateChange={({ viewState, interactionState }) => {\n        if (!interactionState.isDragging && !interactionState.isPanning && !interactionState.isRotating && !interactionState.isZooming) return;\n        const next = viewState as MapState;',
              'onViewStateChange={({ viewState }) => {\n        const next = viewState as MapState;',
          )

          p.write_text(text)
      - name: Verify web
        run: |
          pnpm lint
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/package.json apps/web/src/App.tsx pnpm-lock.yaml
          git commit -m "fix: make 3d terrain real and restore touch pitch"
          git push origin HEAD:fix/real-3d-touch-pitch
