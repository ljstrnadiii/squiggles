name: Spatial core patch helper

on:
  push:
    branches:
      - fix/lazy-spatial-extension

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix: make spatial a core DuckDB capability' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/lazy-spatial-extension
      - name: Patch worker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/duckdb.worker.ts')
          text = path.read_text()

          text = text.replace('let spatialExtensionPromise: Promise<void> | null = null;\n', '')

          start = text.find('function sqlUsesSpatial(sql: string): boolean {')
          if start != -1:
              end = text.find('function viewportPredicate', start)
              if end == -1:
                  raise SystemExit('viewportPredicate anchor not found')
              text = text[:start] + text[end:]

          text = text.replace('    if (sqlUsesSpatial(request.sql)) await ensureSpatialExtension();\n', '')

          anchor = '  connection = await database.connect();\n  const connectMs = performance.now() - connectStarted;\n'
          replacement = '  connection = await database.connect();\n  await connection.query("INSTALL spatial; LOAD spatial");\n  const connectMs = performance.now() - connectStarted;\n'
          if 'await connection.query("INSTALL spatial; LOAD spatial")' not in text:
              if anchor not in text:
                  raise SystemExit('connect anchor not found')
              text = text.replace(anchor, replacement, 1)

          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/duckdb.worker.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: make spatial a core DuckDB capability"
          git push origin HEAD:fix/lazy-spatial-extension
