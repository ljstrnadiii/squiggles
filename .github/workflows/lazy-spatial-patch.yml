name: Lazy spatial patch helper

on:
  push:
    branches:
      - fix/lazy-spatial-extension

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: load DuckDB spatial lazily'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/lazy-spatial-extension
      - name: Patch worker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/duckdb.worker.ts')
          text = path.read_text()

          anchor = 'let initializationTimings = { selectBundleMs: 0, instantiateMs: 0, connectMs: 0 };\n'
          replacement = anchor + 'let spatialExtensionPromise: Promise<void> | null = null;\n'
          if 'let spatialExtensionPromise:' not in text:
              if anchor not in text:
                  raise SystemExit('state anchor not found')
              text = text.replace(anchor, replacement, 1)

          anchor = 'function viewportPredicate(bounds?: Bounds, clean = false): string {\n'
          helper = '''function sqlUsesSpatial(sql: string): boolean {\n  return /\\bST_[A-Za-z0-9_]+\\s*\\(/i.test(sql);\n}\n\nasync function ensureSpatialExtension() {\n  if (!spatialExtensionPromise) {\n    spatialExtensionPromise = connection!.query("INSTALL spatial; LOAD spatial").then(() => undefined);\n  }\n  try {\n    await spatialExtensionPromise;\n  } catch (error) {\n    spatialExtensionPromise = null;\n    throw error;\n  }\n}\n\n'''
          if 'async function ensureSpatialExtension' not in text:
              if anchor not in text:
                  raise SystemExit('helper anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          anchor = '    await configureActivitiesView(request.clean);\n    selectionAll = isUniversalSelectionSql(request.sql);\n'
          replacement = '    await configureActivitiesView(request.clean);\n    if (sqlUsesSpatial(request.sql)) await ensureSpatialExtension();\n    selectionAll = isUniversalSelectionSql(request.sql);\n'
          if 'sqlUsesSpatial(request.sql)' not in text:
              if anchor not in text:
                  raise SystemExit('execute anchor not found')
              text = text.replace(anchor, replacement, 1)

          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/duckdb.worker.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: load DuckDB spatial lazily"
          git push origin HEAD:fix/lazy-spatial-extension
