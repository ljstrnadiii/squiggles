name: Apply tolerance pyramid implementation

on:
  push:
    branches: [feat/tolerance-render-pyramid]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/tolerance-render-pyramid
      - name: Apply implementation patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}: {old[:80]!r}, got {text.count(old)}")
              file.write_text(text.replace(old, new))

          path = Path("apps/web/src/duckdb.worker.ts")
          text = path.read_text()
          text = text.replace('import { chooseLod, LOD_VERTEX_LIMITS, type Lod } from "./lod";', 'import { type Lod } from "./lod";')
          start = text.index("async function preciseVertexEstimates")
          end = text.index("async function summarize")
          block = r'''function availableRenderLods(): Lod[] {
            return [...registeredRenderLevels.keys()].sort((left, right) => left - right);
          }

          function clampAvailableLod(requested: Lod): Lod {
            const levels = availableRenderLods();
            if (!levels.length) return Math.min(requested, 4) as Lod;
            return levels.filter(level => level <= requested).at(-1) ?? levels[0];
          }

          function previousAvailableLod(current: Lod): Lod | null {
            return availableRenderLods().filter(level => level < current).at(-1) ?? null;
          }

          async function exactVertexEstimate(level: Lod, bounds: Bounds | undefined, clean: boolean): Promise<number> {
            const file = registeredRenderLevels.get(level);
            if (!file) return Number.POSITIVE_INFINITY;
            const geometryCount = clean ? "clean_vertex_count" : "vertex_count";
            const relation = `read_parquet('${file.name.replaceAll("'", "''")}')`;
            const estimate = await connection!.query(`SELECT coalesce(sum(a.${geometryCount}),0) total FROM ${relation} a${selectionJoin()} WHERE ${viewportPredicate(bounds, clean)}`);
            const row = estimate.toArray()[0] as unknown as Record<string, unknown>;
            return Number(scalar(row.total));
          }

          async function planRenderLod(requested: Lod, budget: number, bounds: Bounds | undefined, clean: boolean): Promise<{ lod: Lod; estimate: number }> {
            let level = clampAvailableLod(requested);
            while (true) {
              const cheap = selectionAll ? manifestVertexEstimate(level, bounds, clean) : null;
              const estimate = cheap != null && cheap <= budget ? cheap : await exactVertexEstimate(level, bounds, clean);
              if (estimate <= budget) return { lod: level, estimate };
              const previous = previousAvailableLod(level);
              if (previous == null) return { lod: level, estimate };
              level = previous;
            }
          }

          async function rawVertexEstimate(bounds: Bounds | undefined, fallback: number): Promise<number> {
            const levels = availableRenderLods();
            const full = levels.at(-1);
            if (selectionAll && full != null) return manifestVertexEstimate(full, bounds, false) ?? fallback;
            if (selectionAll) return fallback;
            const estimate = await connection!.query(`SELECT coalesce(sum(a.point_count),0) total FROM current_selection a WHERE ${viewportPredicate(bounds)}`);
            const row = estimate.toArray()[0] as unknown as Record<string, unknown>;
            return Number(scalar(row.total));
          }

          async function render(lod: Lod, budget: number, bounds?: Bounds, clean = false) {
            const plan = await planRenderLod(lod, budget, bounds, clean);
            const plannedLod = plan.lod;
            const renderFile = registeredRenderLevels.get(plannedLod);
            const scan = viewportScan(bounds, renderFile ? [renderFile] : registeredFiles);
            const rawEstimate = await rawVertexEstimate(bounds, plan.estimate);
            if (scan.files.length === 0) return { lod: plannedLod, batches: [], activityCount: 0, geometryBufferBytes: 0, vertexCount: 0, plannedVertexEstimate: plan.estimate, rawVertexEstimate: rawEstimate, vertexBudget: budget, scan: scan.metrics };
            const relation = renderFile
              ? `read_parquet('${renderFile.name.replaceAll("'", "''")}')`
              : viewportRelation(scan.files, clean);
            if (!relation) return { lod: plannedLod, batches: [], activityCount: 0, geometryBufferBytes: 0, vertexCount: 0, plannedVertexEstimate: 0, rawVertexEstimate: rawEstimate, vertexBudget: budget, scan: scan.metrics };
            const geometry = renderFile
              ? (clean ? "geometry_clean" : "geometry")
              : plannedLod === 4 ? (clean ? "geometry_clean" : "geometry") : `geometry_${clean ? "clean_" : ""}lod${plannedLod}`;
            const distance = clean ? "coalesce(a.clean_distance_m,a.distance_m)" : "a.distance_m";
            const gain = clean ? "coalesce(a.clean_elevation_gain_m,a.elevation_gain_m)" : "a.elevation_gain_m";
            const maximum = clean ? "coalesce(a.clean_max_elevation_m,a.max_elevation_m)" : "a.max_elevation_m";
            const result = await connection!.query(`SELECT a.activity_id,a.name,a.sport_type,CAST(a.start_time AS VARCHAR) start_time,${distance} distance_m,${gain} elevation_gain_m,${maximum} max_elevation_m,a.source_url,a.${geometry} FROM ${relation} a${selectionJoin()} WHERE ${viewportPredicate(bounds, clean)}`);
            const batches = binaryRouteBatches(result, geometry);
            const vertexCount = batches.reduce((total, batch) => total + batch.positions.length / 2, 0);
            const geometryBufferBytes = batches.reduce((total, batch) => total + batch.positions.byteLength + batch.startIndices.byteLength + batch.segmentActivityIndices.byteLength, 0);
            const activityCount = batches.reduce((total, batch) => total + batch.activities.length, 0);
            return { lod: plannedLod, batches, activityCount, geometryBufferBytes, vertexCount, plannedVertexEstimate: plan.estimate, rawVertexEstimate: rawEstimate, vertexBudget: budget, scan: { ...scan.metrics, keptRowCount: activityCount } };
          }

          '''
          path.write_text(text[:start] + block + text[end:])

          path = Path("packages/ingest/src/activity_map_ingest/geoparquet_sink.py")
          text = path.read_text()
          text = text.replace(
              "from .schema import (\n",
              "from .render_lod import RENDER_TOLERANCES_M, simplify_coordinates_meters\nfrom .schema import (\n",
          )
          start = text.index("RENDER_LEVELS = {")
          end = text.index("RENDER_ROW_GROUP_TARGET_VERTICES")
          text = text[:start] + text[end:]
          start = text.index("def write_render_pyramid")
          end = text.index("\n\nclass GeoParquetDataSink")
          function = r'''def _render_geometry(column: pa.ChunkedArray, tolerance_m: float | None) -> pa.Array | pa.ChunkedArray:
              if tolerance_m is None:
                  return column
              return pa.array(
                  [simplify_coordinates_meters(value, tolerance_m) for value in column.to_pylist()],
                  type=column.type,
              )


          def write_render_pyramid(table: pa.Table, path: Path) -> list[ShardMetadata]:
              """Write immutable render artifacts from full canonical geometry."""
              path.mkdir(parents=True, exist_ok=True)
              combined = table.sort_by([("spatial_order", "ascending"), ("activity_id", "ascending")])
              levels = []
              for lod, tolerance_m in enumerate(RENDER_TOLERANCES_M):
                  geometry = _render_geometry(combined["geometry"], tolerance_m)
                  clean_geometry = _render_geometry(combined["geometry_clean"], tolerance_m)
                  arrays = [combined[name] for name in RENDER_SCALARS]
                  arrays.extend([
                      pc.cast(pc.list_value_length(geometry), pa.int64()),
                      pc.cast(pc.list_value_length(clean_geometry), pa.int64()),
                      geometry,
                      clean_geometry,
                  ])
                  render = cast(Table[RenderActivitySchema], pa.Table.from_arrays(arrays, schema=render_arrow_schema()))
                  render = validate_render_table(render)
                  render = cast(Table[RenderActivitySchema], render.replace_schema_metadata({**(render.schema.metadata or {}), **render_geo_metadata(_table_bounds(render))}))
                  payload_groups = _render_row_groups(render)
                  row_groups = []
                  for group in payload_groups:
                      row_groups.append({
                          "row_count": group.num_rows,
                          "bbox": _table_bounds(group),
                          "vertex_count": {"sum": pc.sum(group["vertex_count"]).as_py(), "min": pc.min(group["vertex_count"]).as_py(), "max": pc.max(group["vertex_count"]).as_py()},
                          "clean_vertex_count": {"sum": pc.sum(group["clean_vertex_count"]).as_py(), "min": pc.min(group["clean_vertex_count"]).as_py(), "max": pc.max(group["clean_vertex_count"]).as_py()},
                      })
                  target = path / f"lod-{lod}.parquet"
                  output = pa.BufferOutputStream()
                  with pq.ParquetWriter(output, render.schema, compression="zstd") as writer:
                      for group in payload_groups:
                          writer.write_table(group, row_group_size=group.num_rows)
                  payload = output.getvalue()
                  with target.open("wb") as handle:
                      handle.write(memoryview(payload))
                  levels.append({
                      "lod": lod,
                      "tolerance_m": tolerance_m,
                      "path": f"render/{target.name}",
                      "row_count": render.num_rows,
                      "byte_size": payload.size,
                      "sha256": hashlib.sha256(payload).hexdigest(),
                      "bbox": _table_bounds(render),
                      "row_group_count": len(row_groups),
                      "row_groups": row_groups,
                  })
              return levels
          '''
          path.write_text(text[:start] + function + text[end:])

          replace_once(
              "packages/ingest/src/activity_map_ingest/compiler.py",
              "from .parsers import TrackPoint, checksum, clean_track, haversine_distance, parse_track, simplify\n",
              "from .parsers import TrackPoint, checksum, clean_track, haversine_distance, parse_track, simplify\nfrom .render_lod import RENDER_LEVEL_COUNT, RENDER_PYRAMID_VERSION\n",
          )
          replace_once("packages/ingest/src/activity_map_ingest/compiler.py", 'COMPILER_VERSION = "0.4.0"', 'COMPILER_VERSION = "0.5.0"')
          replace_once(
              "packages/ingest/src/activity_map_ingest/compiler.py",
              '        "compiler_version": COMPILER_VERSION,\n        "relation": "activities",',
              '        "compiler_version": COMPILER_VERSION,\n        "render_pyramid_version": RENDER_PYRAMID_VERSION,\n        "relation": "activities",',
          )
          replace_once(
              "packages/ingest/src/activity_map_ingest/compiler.py",
              '    if [level.get("lod") for level in render_levels] != list(range(5)):\n        raise ValueError("manifest must contain render levels 0 through 4")',
              '    if [level.get("lod") for level in render_levels] != list(range(RENDER_LEVEL_COUNT)):\n        raise ValueError(f"manifest must contain render levels 0 through {RENDER_LEVEL_COUNT - 1}")',
          )

          replace_once(
              "packages/ingest/src/activity_map_ingest/dataset_builds.py",
              "from .geoparquet_sink import write_render_pyramid\n",
              "from .geoparquet_sink import write_render_pyramid\nfrom .render_lod import RENDER_PYRAMID_VERSION\n",
          )
          replace_once(
              "packages/ingest/src/activity_map_ingest/dataset_builds.py",
              '        "compiler_version": COMPILER_VERSION,\n        "shards": normalized_shards,',
              '        "compiler_version": COMPILER_VERSION,\n        "render_pyramid_version": RENDER_PYRAMID_VERSION,\n        "shards": normalized_shards,',
          )

          path = Path("packages/ingest/src/activity_map_ingest/cloud_job.py")
          text = path.read_text()
          text = text.replace(
              '            "schemaVersion": {"S": str(manifest["schema_version"])},\n            "activityCount":',
              '            "schemaVersion": {"S": str(manifest["schema_version"])},\n            "compilerVersion": {"S": str(manifest.get("compiler_version", "unknown"))},\n            "renderVersion": {"S": str(manifest.get("render_pyramid_version", "1"))},\n            "activityCount":',
              1,
          )
          text = text.replace(
              '        "schemaVersion": {"S": str(manifest["schema_version"])},\n        "activityCount":',
              '        "schemaVersion": {"S": str(manifest["schema_version"])},\n        "compilerVersion": {"S": str(manifest.get("compiler_version", "unknown"))},\n        "renderVersion": {"S": str(manifest.get("render_pyramid_version", "1"))},\n        "activityCount":',
              1,
          )
          text = text.replace(
              '                "activeBuild": {"S": build_id},\n                "activityCount":',
              '                "activeBuild": {"S": build_id},\n                "renderVersion": {"S": str(manifest.get("render_pyramid_version", "1"))},\n                "activityCount":',
              1,
          )
          path.write_text(text)

          replace_once(
              "infra/aws/index.ts",
              '    actions: ["cognito-idp:*", "dynamodb:CreateTable", "dynamodb:DeleteTable", "dynamodb:Describe*", "dynamodb:List*", "dynamodb:TagResource", "dynamodb:UntagResource", "dynamodb:Update*", "apigateway:*",',
              '    actions: ["cognito-idp:*", "dynamodb:CreateTable", "dynamodb:DeleteTable", "dynamodb:Describe*", "dynamodb:List*", "dynamodb:GetItem", "dynamodb:Scan", "dynamodb:TagResource", "dynamodb:UntagResource", "dynamodb:Update*", "apigateway:*",',
          )
          replace_once(
              "infra/aws/index.ts",
              "export const metadataTableName = metadataTable.name;\nexport const controlPlaneApiUrl = controlPlaneApi.apiEndpoint;",
              "export const metadataTableName = metadataTable.name;\nexport const ingestJobQueue = ingestQueue.arn;\nexport const ingestJobDefinition = ingestDefinition.arn;\nexport const controlPlaneApiUrl = controlPlaneApi.apiEndpoint;",
          )
          PY
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/duckdb.worker.ts packages/ingest/src/activity_map_ingest/geoparquet_sink.py packages/ingest/src/activity_map_ingest/compiler.py packages/ingest/src/activity_map_ingest/dataset_builds.py packages/ingest/src/activity_map_ingest/cloud_job.py infra/aws/index.ts
          git commit -m 'feat: build tolerance render pyramids'
          git push
