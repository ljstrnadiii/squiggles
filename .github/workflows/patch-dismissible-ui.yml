name: Patch dismissible UI
on:
  push:
    branches: [fix/dismissible-errors-mobile-close]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/dismissible-errors-mobile-close
      - name: Apply UI fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing marker in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "apps/web/src/App.tsx",
              '''  const openActivity = useCallback(async (activity: RouteMetadata) => {\n    setStatsOpen(false); setTableOpen(false); setRenderingOpen(false); setAboutOpen(false); setToolbarOpen(false);\n    setSelected(null); setProfileHover(null); setHover(null); setIsolateSelected(false);\n    const detail = await engine.getActivity(activity.activityId);\n    if (detail) setSelected(detail);\n  }, [engine]);''',
              '''  const openActivity = useCallback(async (activity: RouteMetadata) => {\n    setStatsOpen(false); setTableOpen(false); setRenderingOpen(false); setAboutOpen(false); setToolbarOpen(false);\n    setSelected(null); setProfileHover(null); setHover(null); setIsolateSelected(false);\n    try {\n      const detail = await engine.getActivity(activity.activityId);\n      if (detail) setSelected(detail);\n    } catch (reason) {\n      setError(reason instanceof Error ? reason.message : "Could not load activity details.");\n    }\n  }, [engine]);''',
          )
          replace(
              "apps/web/src/App.tsx",
              '''    {error && <div className="error global-error"><strong>Something needs attention</strong><span>{error}</span></div>}''',
              '''    {error && <div className="error global-error" role="alert"><strong>Something needs attention</strong><span>{error}</span><button className="error-close" aria-label="Dismiss error" onClick={() => setError("")}>×</button></div>}''',
          )
          replace(
              "apps/web/src/styles.css",
              '''.error span {\n  opacity: 0.8;\n}\n.global-error {''',
              '''.error span {\n  opacity: 0.8;\n}\n.error-close {\n  flex: none;\n  margin-left: auto;\n  padding: 0 4px;\n  border: 0;\n  background: transparent;\n  color: inherit;\n  font-size: 18px;\n  line-height: 1;\n}\n.global-error {''',
          )
          replace(
              "apps/web/src/styles.css",
              '''  .system-settings {\n    top: auto;\n    left: 0;\n    right: 0;\n    bottom: 0;\n    width: 100%;\n    padding: 16px max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));\n    border-width: 1px 0 0;''',
              '''  .system-settings {\n    top: auto;\n    left: 0;\n    right: 0;\n    bottom: 0;\n    width: 100%;\n    max-height: calc(100dvh - 50px);\n    overflow: auto;\n    padding: 16px max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));\n    border-width: 1px 0 0;''',
          )
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/App.tsx apps/web/src/styles.css
          git commit -m 'fix: make errors and mobile account drawer dismissible'
          git push
