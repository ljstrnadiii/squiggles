name: Refresh PR 78
on:
  push:
    branches: [fix/spatial-filter-streaming]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/spatial-filter-streaming
      - name: Apply retained fixes
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          spatial = ""
          tests = ""
          Path('apps/web/src/spatialSql.ts').write_bytes(base64.b64decode(spatial))
          Path('apps/web/src/spatialSql.test.ts').write_bytes(base64.b64decode(tests))
          p = Path('apps/web/src/App.tsx')
          text = p.read_text()
          old = 'onClick: (info: PickingInfo) => { if (spatialDrawing) return; const item = info.index >= 0 ? pickedActivity(batch, info.index) : null; if (item) void openActivity(item); } })'
          new = 'onClick: (info: PickingInfo) => { if (spatialDrawing) return false; const item = info.index >= 0 ? pickedActivity(batch, info.index) : null; if (!item) return false; void openActivity(item); return true; } })'
          if old not in text: raise SystemExit('route hit-target marker missing')
          text = text.replace(old, new, 1)
          old = 'if (!info.object) { setSelected(null); setProfileHover(null); } }} />'
          new = 'if (!info.layer) { setSelected(null); setProfileHover(null); } }} />'
          if old not in text: raise SystemExit('background click marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/App.tsx apps/web/src/spatialSql.ts apps/web/src/spatialSql.test.ts
          git commit -m 'fix: preserve route picks after spatial filters'
          git push
