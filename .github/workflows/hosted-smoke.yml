name: Hosted map smoke

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify production startup path
        run: python scripts/check_hosted_map.py
      - name: Install browser smoke dependency
        run: python -m pip install playwright==1.55.0
      - name: Exercise production map in Chrome
        run: python scripts/check_hosted_browser.py
      - name: Profile production browser scenarios
        run: python scripts/profile_hosted_browser.py
      - name: Upload browser profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-browser-profile
          path: browser-profile-artifacts
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-browser-failure
          path: browser-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 3
