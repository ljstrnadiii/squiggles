name: Apply spatial draw type fix
on:
  push:
    branches: [feat/drawn-spatial-filter]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/drawn-spatial-filter
      - name: Apply isolated App.tsx fix and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/App.tsx')
          text = path.read_text()
          old = 'const coordinate = info.coordinate; if (coordinate?.length >= 2) setSpatialDraft(previous => [...previous, [coordinate[0], coordinate[1]]]);'
          new = 'const coordinate = info.coordinate; if (coordinate && coordinate.length >= 2) { const longitude = coordinate[0], latitude = coordinate[1]; if (longitude !== undefined && latitude !== undefined) setSpatialDraft(previous => [...previous, [longitude, latitude]]); }'
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/patch-spatial-app.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: narrow drawn map coordinates'
          git push origin HEAD:feat/drawn-spatial-filter
