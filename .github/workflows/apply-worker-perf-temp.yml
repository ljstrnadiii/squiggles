name: Apply worker startup perf fix (temporary)

on:
  push:
    branches: [perf/worker-open-spatial]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove unused spatial extension startup
        run: sed -i '/INSTALL spatial; LOAD spatial;/d' apps/web/src/duckdb.worker.ts
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/duckdb.worker.ts
          git diff --cached --quiet && exit 0
          git commit -m "perf: skip unused DuckDB spatial extension startup"
          git push
