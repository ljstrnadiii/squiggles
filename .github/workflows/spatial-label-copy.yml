name: Update spatial predicate labels

on:
  push:
    branches: [feat/drawn-spatial-filter]

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/drawn-spatial-filter
      - name: Update labels
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/App.tsx')
          text = path.read_text()
          replacements = {
              '<option value="intersects">Intersects area</option>': '<option value="intersects">Intersects</option>',
              '<option value="within">Entirely within area</option>': '<option value="within">Contains</option>',
              'tab.spatialFilter?.predicate === "within" ? "Entire route within" : "Intersects"': 'tab.spatialFilter?.predicate === "within" ? "Contains" : "Intersects"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected text: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/App.tsx
          git commit -m 'fix: simplify spatial predicate labels'
          git push
