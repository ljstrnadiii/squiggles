name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen pre-commit run --all-files

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Require render version bump for format changes
        if: github.event_name == 'pull_request'
        run: uv run --frozen python scripts/check_render_version.py origin/${{ github.base_ref }}
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - name: Compile and validate current dataset format
        run: >-
          uv run --frozen pytest
          packages/ingest/tests/test_ingest.py::test_compile_validate_and_refuse_overwrite
      - name: Run remaining Python tests
        run: uv run --frozen pytest -k 'not test_compile_validate_and_refuse_overwrite'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @squiggles/aws build
      - run: docker build -f Dockerfile.ingest -t squiggles-ingest:test .

  hosted-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify production startup path
        shell: bash
        run: |
          set -euo pipefail
          base="https://squiggles.io"
          config="$(curl --fail --silent --show-error --location --retry 2 "$base/runtime-config.json")"
          dataset_id="$(python -c 'import json,sys; print(json.load(sys.stdin)["defaultDatasetId"])' <<<"$config")"
          manifest="$(curl --fail --silent --show-error --location --retry 2 "$base/datasets/$dataset_id/dataset.json")"
          MANIFEST="$manifest" python -c '
import json, os
manifest = json.loads(os.environ["MANIFEST"])
assert manifest.get("render_pyramid_version") == "3", manifest.get("render_pyramid_version")
assert manifest.get("shards"), "manifest has no canonical shards"
levels = manifest.get("render_levels") or []
assert levels and all(level.get("files") for level in levels), "manifest has no v3 render files"
print("schema", manifest.get("schema_version"))
print("activities", manifest.get("activity_count"))
print("build", (manifest.get("build") or {}).get("id"))
print("canonical", manifest["shards"][0]["path"])
print("render", levels[0]["files"][0]["path"])
'
          canonical="$(python -c 'import json,sys; print(json.load(sys.stdin)["shards"][0]["path"])' <<<"$manifest")"
          render="$(python -c 'import json,sys; print(json.load(sys.stdin)["render_levels"][0]["files"][0]["path"])' <<<"$manifest")"
          for path in "$canonical" "$render"; do
            url="$base/datasets/$dataset_id/$path"
            echo "RANGE $url"
            headers="$(mktemp)"
            curl --fail --silent --show-error --location --retry 2 --range 0-31 --dump-header "$headers" --output /dev/null "$url"
            cat "$headers"
            grep -Eq '^HTTP/[^ ]+ (200|206)' "$headers"
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pre-commit, python, web, secrets]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @squiggles/aws build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ingest
          push: true
          tags: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com/squiggles-ingest:${{ github.sha }}

      # Stage only the new Batch job definition first. The currently deployed web app
      # remains untouched while datasets are rebuilt to the new render format.
      - name: Stage ingest compiler
        uses: pulumi/actions@v7
        id: pulumi-ingest
        with:
          command: up
          stack-name: dev
          work-dir: infra/aws
          cloud-url: s3://squiggle-pulumi-state-${{ vars.AWS_ACCOUNT_ID }}-us-west-2?region=us-west-2
          comment-on-summary: true
          target: urn:pulumi:dev::activity-map-aws::aws:batch/jobDefinition:JobDefinition::ingest
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SQUIGGLES_BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          INGEST_IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com/squiggles-ingest:${{ github.sha }}

      - name: Rebuild stale render pyramids and wait
        env:
          METADATA_TABLE_NAME: ${{ steps.pulumi-ingest.outputs.metadataTableName }}
          INGEST_JOB_QUEUE: ${{ steps.pulumi-ingest.outputs.ingestJobQueue }}
          INGEST_JOB_DEFINITION: ${{ steps.pulumi-ingest.outputs.ingestJobDefinition }}
          RENDER_PYRAMID_VERSION: "3"
        run: python scripts/rebuild_render_pyramids.py

      # Only after every stale dataset has successfully activated the new render
      # version do we reconcile the full stack and publish the v3-only website.
      - name: Deploy application
        uses: pulumi/actions@v7
        id: pulumi
        with:
          command: up
          stack-name: dev
          work-dir: infra/aws
          cloud-url: s3://squiggle-pulumi-state-${{ vars.AWS_ACCOUNT_ID }}-us-west-2?region=us-west-2
          comment-on-summary: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SQUIGGLES_BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          INGEST_IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com/squiggles-ingest:${{ github.sha }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
