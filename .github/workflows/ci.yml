name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen pre-commit run --all-files

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Require render version bump for format changes
        if: github.event_name == 'pull_request'
        run: uv run --frozen python scripts/check_render_version.py origin/${{ github.base_ref }}
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy
      - name: Compile and validate current dataset format
        run: >-
          uv run --frozen pytest
          packages/ingest/tests/test_ingest.py::test_compile_validate_and_refuse_overwrite
      - name: Run remaining Python tests
        run: uv run --frozen pytest -k 'not test_compile_validate_and_refuse_overwrite'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @squiggles/aws build
      - run: docker build -f Dockerfile.ingest -t squiggles-ingest:test .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pre-commit, python, web, secrets]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @squiggles/aws build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ingest
          push: true
          tags: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com/squiggles-ingest:${{ github.sha }}

      # Stage only the new Batch job definition first. The currently deployed web app
      # remains untouched while datasets are rebuilt to the new render format.
      - name: Stage ingest compiler
        uses: pulumi/actions@v7
        id: pulumi-ingest
        with:
          command: up
          stack-name: dev
          work-dir: infra/aws
          cloud-url: s3://squiggle-pulumi-state-${{ vars.AWS_ACCOUNT_ID }}-us-west-2?region=us-west-2
          comment-on-summary: true
          target: urn:pulumi:dev::activity-map-aws::aws:batch/jobDefinition:JobDefinition::ingest
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SQUIGGLES_BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          INGEST_IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com/squiggles-ingest:${{ github.sha }}

      - name: Rebuild stale render pyramids and wait
        env:
          METADATA_TABLE_NAME: ${{ steps.pulumi-ingest.outputs.metadataTableName }}
          INGEST_JOB_QUEUE: ${{ steps.pulumi-ingest.outputs.ingestJobQueue }}
          INGEST_JOB_DEFINITION: ${{ steps.pulumi-ingest.outputs.ingestJobDefinition }}
          RENDER_PYRAMID_VERSION: "3"
        run: python scripts/rebuild_render_pyramids.py

      # Only after every stale dataset has successfully activated the new render
      # version do we reconcile the full stack and publish the v3-only website.
      - name: Deploy application
        uses: pulumi/actions@v7
        id: pulumi
        with:
          command: up
          stack-name: dev
          work-dir: infra/aws
          cloud-url: s3://squiggle-pulumi-state-${{ vars.AWS_ACCOUNT_ID }}-us-west-2?region=us-west-2
          comment-on-summary: true
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SQUIGGLES_BUDGET_EMAIL: ${{ secrets.BUDGET_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          INGEST_IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com/squiggles-ingest:${{ github.sha }}

      - name: Invalidate production delivery cache
        env:
          DISTRIBUTION_ID: ${{ steps.pulumi.outputs.distributionId }}
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$invalidation_id"

      - name: Smoke test production dataset startup
        env:
          APPLICATION_URL: ${{ steps.pulumi.outputs.applicationUrl }}
        run: |
          set -euo pipefail
          nonce="${GITHUB_SHA}-$(date +%s)"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$APPLICATION_URL/runtime-config.json?smoke=$nonce" \
            -o /tmp/runtime-config.json
          dataset_id=$(python - <<'PY'
          import json
          config = json.load(open('/tmp/runtime-config.json'))
          dataset_id = config.get('defaultDatasetId')
          if not dataset_id:
              raise SystemExit('runtime-config.json has no defaultDatasetId')
          print(dataset_id)
          PY
          )
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "$APPLICATION_URL/datasets/$dataset_id/dataset.json?smoke=$nonce" \
            -o /tmp/dataset.json
          render_path=$(python - <<'PY'
          import json
          manifest = json.load(open('/tmp/dataset.json'))
          if str(manifest.get('render_pyramid_version')) != '3':
              raise SystemExit(f"expected render pyramid v3, got {manifest.get('render_pyramid_version')!r}")
          levels = manifest.get('render_levels') or []
          if len(levels) != 8:
              raise SystemExit(f'expected 8 render levels, got {len(levels)}')
          files = levels[0].get('files') or []
          if not files:
              raise SystemExit('LOD 0 has no render files')
          print(files[0]['path'])
          PY
          )
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --range 0-1023 \
            "$APPLICATION_URL/datasets/$dataset_id/$render_path" \
            -o /tmp/render-range.bin
          test -s /tmp/render-range.bin
          echo "Production startup smoke test passed for dataset $dataset_id ($render_path)."

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
