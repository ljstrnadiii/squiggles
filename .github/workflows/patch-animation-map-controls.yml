name: Patch animation map controls

on:
  push:
    branches: [feature/arbitrary-animation-fps]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/arbitrary-animation-fps
          fetch-depth: 0
      - run: python .github/scripts/patch_animation_map_controls.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx
          git rm .github/workflows/patch-animation-map-controls.yml .github/scripts/patch_animation_map_controls.py
          git commit -m "feat: keep animation controls on the map"
          git push origin HEAD:feature/arbitrary-animation-fps
