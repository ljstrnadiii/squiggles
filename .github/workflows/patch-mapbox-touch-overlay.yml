name: Patch Mapbox touch overlay
on:
  push:
    branches: [fix/mapbox-touch-overlay]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mapbox-touch-overlay
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix overlay touch ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/App.tsx')
          s = p.read_text()
          old = 'new MapboxOverlay({ interleaved: false, layers: initialLayers.current'
          new = 'new MapboxOverlay({ interleaved: true, layers: initialLayers.current'
          if s.count(old) != 1:
              raise SystemExit(f'expected one overlay match, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Verify
        run: |
          pnpm lint
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/App.tsx
          git commit -m "fix: keep Mapbox touch gestures on map canvas"
          git push origin HEAD:fix/mapbox-touch-overlay
