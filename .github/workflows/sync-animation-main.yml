name: Sync animation PR with main
on:
  push:
    branches: [feature/query-visual-dimensions]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/query-visual-dimensions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - name: Merge latest main and resolve visual-encoding overlaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^(apps/web/src/App\.tsx|apps/web/src/contracts\.ts)?$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          for file in apps/web/src/App.tsx apps/web/src/contracts.ts; do
            if printf '%s\n' "$conflicts" | grep -qx "$file"; then
              git checkout --theirs -- "$file"
              git add "$file"
            fi
          done

          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          app_path = Path("apps/web/src/App.tsx")
          app = app_path.read_text()
          app = replace_once(app, 'MapState, QueryTab, RenderCacheMetrics', 'MapState, QueryDimension, QueryTab, RenderCacheMetrics', 'QueryDimension import')
          app = replace_once(app, 'import { recordRenderingDiagnostics } from "./diagnosticState";\n', 'import { recordRenderingDiagnostics } from "./diagnosticState";\nimport { VisualEncodingControls } from "./VisualEncodingControls";\nimport { activityVisible, colorForVisualDimension, DEFAULT_VISUAL_ENCODING, dimensionByName, reconcileVisualEncoding, type VisualEncodingSettings } from "./visualEncoding";\n', 'visual encoding imports')
          app = replace_once(app, '  const [routeBatches, setRouteBatches] = useState<BinaryRouteBatch[]>([]);\n', '  const [routeBatches, setRouteBatches] = useState<BinaryRouteBatch[]>([]);\n  const [queryDimensions, setQueryDimensions] = useState<QueryDimension[]>([]);\n  const [visualEncoding, setVisualEncoding] = useState<VisualEncodingSettings>(DEFAULT_VISUAL_ENCODING);\n', 'visual encoding state')
          app = replace_once(app, '      const result = await engine.execute(current, mapState.zoom, activeTerrainCamera?.bounds ?? viewportBounds(mapState, mapElement.current), activeTerrainCamera?.size);\n      if (selection !== selectionRequest.current) return;\n\n      selectionReady.current = true;\n', '      const result = await engine.execute(current, mapState.zoom, activeTerrainCamera?.bounds ?? viewportBounds(mapState, mapElement.current), activeTerrainCamera?.size);\n      if (selection !== selectionRequest.current) return;\n      const dimensions = result.dimensions ?? [];\n      setQueryDimensions(dimensions);\n      setVisualEncoding(currentEncoding => reconcileVisualEncoding(currentEncoding, dimensions));\n\n      selectionReady.current = true;\n', 'query dimensions result')
          app = replace_once(app, '    setRouteBatches([]); setHeat(emptyHeat);\n', '    setRouteBatches([]); setHeat(emptyHeat); setQueryDimensions([]); setVisualEncoding(DEFAULT_VISUAL_ENCODING);\n', 'dataset reset')

          old_colors = "\n".join([
              '  const overviewBatches = useMemo(() => isolateSelected ? [] : routeBatches, [isolateSelected, routeBatches]);',
              '  const overviewColors = useMemo(() => routeBatches.map(batch => routeColors(batch, activity => {',
              '    if (activity.activityId === selected?.activityId) return [0, 0, 0, 0];',
              '    return tab.style.heatEnabled',
              '      ? colorForWeight(heat.scores.get(activity.activityId) ?? 0, heat.maxScore, tab.style.heatPalette, tab.style.heatTemperature)',
              '      : routeColor(tab.style.color, 190);',
              '  })), [heat, routeBatches, selected, tab.style.color, tab.style.heatEnabled, tab.style.heatPalette, tab.style.heatTemperature]);',
              '  const terrainColors = useMemo(() => routeBatches.map(batch => routeColors(batch, activity => tab.style.heatEnabled',
              '    ? colorForWeight(heat.scores.get(activity.activityId) ?? 0, heat.maxScore, tab.style.heatPalette, tab.style.heatTemperature)',
              '    : routeColor(tab.style.color, 190))), [heat, routeBatches, tab.style.color, tab.style.heatEnabled, tab.style.heatPalette, tab.style.heatTemperature]);',
              '',
          ])
          new_colors = "\n".join([
              '  const animationDimension = useMemo(() => dimensionByName(queryDimensions, visualEncoding.animateBy), [queryDimensions, visualEncoding.animateBy]);',
              '  const colorDimension = useMemo(() => dimensionByName(queryDimensions, visualEncoding.colorBy), [queryDimensions, visualEncoding.colorBy]);',
              '  const heatActive = tab.style.heatEnabled && !colorDimension;',
              '  const overviewBatches = useMemo(() => isolateSelected ? [] : routeBatches, [isolateSelected, routeBatches]);',
              '  const overviewColors = useMemo(() => routeBatches.map(batch => routeColors(batch, activity => {',
              '    if (!activityVisible(animationDimension, visualEncoding, activity.activityId) || activity.activityId === selected?.activityId) return [0, 0, 0, 0];',
              '    const encoded = colorForVisualDimension(colorDimension, activity.activityId, visualEncoding.palette);',
              '    if (encoded) return encoded;',
              '    return heatActive',
              '      ? colorForWeight(heat.scores.get(activity.activityId) ?? 0, heat.maxScore, tab.style.heatPalette, tab.style.heatTemperature)',
              '      : routeColor(tab.style.color, 190);',
              '  })), [animationDimension, colorDimension, heat, heatActive, routeBatches, selected, tab.style.color, tab.style.heatPalette, tab.style.heatTemperature, visualEncoding]);',
              '  const terrainColors = useMemo(() => routeBatches.map(batch => routeColors(batch, activity => {',
              '    if (!activityVisible(animationDimension, visualEncoding, activity.activityId)) return [0, 0, 0, 0];',
              '    const encoded = colorForVisualDimension(colorDimension, activity.activityId, visualEncoding.palette);',
              '    if (encoded) return encoded;',
              '    return heatActive',
              '      ? colorForWeight(heat.scores.get(activity.activityId) ?? 0, heat.maxScore, tab.style.heatPalette, tab.style.heatTemperature)',
              '      : routeColor(tab.style.color, 190);',
              '  })), [animationDimension, colorDimension, heat, heatActive, routeBatches, tab.style.color, tab.style.heatPalette, tab.style.heatTemperature, visualEncoding]);',
              '',
          ])
          app = replace_once(app, old_colors, new_colors, 'visual colors')
          app = replace_once(app, '      new PathLayer({ id: `routes-${index}`, data: overviewPathData[index], _pathType: "open", positionFormat: "XY", getWidth: tab.style.heatEnabled ? lineWidths.heat : lineWidths.route, widthUnits: "pixels", widthMinPixels: 0.35, pickable: false }),\n', '      new PathLayer({ id: `routes-${index}`, data: overviewPathData[index], _pathType: "open", positionFormat: "XY", getWidth: heatActive ? lineWidths.heat : lineWidths.route, widthUnits: "pixels", widthMinPixels: 0.35, pickable: false }),\n', 'route width')
          old_hit = '      new PathLayer({ id: `route-hit-targets-${index}`, data: pickingPathData[index], _pathType: "open", positionFormat: "XY", getColor: [0, 0, 0, 0], getWidth: lineWidths.route + 10, widthUnits: "pixels", widthMinPixels: 10, pickable: !spatialDrawing, onHover: (info: PickingInfo) => { if (spatialDrawing) return; const item = info.index >= 0 ? pickedActivity(batch, info.index) : null; if (!item) { setHover(null); return; } const x = info.x, y = info.y, activityId = item.activityId; void engine.getRouteMetadata(activityId).then(metadata => { if (metadata) setHover({ x, y, item: metadata, origin: "map" }); }); }, onClick: (info: PickingInfo) => { if (spatialDrawing) return false; const item = info.index >= 0 ? pickedActivity(batch, info.index) : null; if (!item) return false; void openActivity(item); return true; } }),\n'
          new_hit = '      new PathLayer({ id: `route-hit-targets-${index}`, data: pickingPathData[index], _pathType: "open", positionFormat: "XY", getColor: [0, 0, 0, 0], getWidth: lineWidths.route + 10, widthUnits: "pixels", widthMinPixels: 10, pickable: !spatialDrawing, onHover: (info: PickingInfo) => { if (spatialDrawing) return; const item = info.index >= 0 ? pickedActivity(batch, info.index) : null; if (!item || !activityVisible(animationDimension, visualEncoding, item.activityId)) { setHover(null); return; } const x = info.x, y = info.y, activityId = item.activityId; void engine.getRouteMetadata(activityId).then(metadata => { if (metadata) setHover({ x, y, item: metadata, origin: "map" }); }); }, onClick: (info: PickingInfo) => { if (spatialDrawing) return false; const item = info.index >= 0 ? pickedActivity(batch, info.index) : null; if (!item || !activityVisible(animationDimension, visualEncoding, item.activityId)) return false; void openActivity(item); return true; } }),\n'
          app = replace_once(app, old_hit, new_hit, 'route hit targets')
          app = replace_once(app, '  ], [engine, hover, hoverPathData, isolateSelected, lineWidths, openActivity, overviewBatches, overviewPathData, pickingPathData, profileHover, routeBatches, selected, selectedSegments, spatialDraft, spatialDrawing, tab.spatialFilter, tab.style.color, tab.style.heatEnabled]);\n', '  ], [animationDimension, engine, heatActive, hover, hoverPathData, isolateSelected, lineWidths, openActivity, overviewBatches, overviewPathData, pickingPathData, profileHover, routeBatches, selected, selectedSegments, spatialDraft, spatialDrawing, tab.spatialFilter, tab.style.color, visualEncoding]);\n', 'layer dependencies')
          app = replace_once(app, '      <section className="toolbar-section"><h3>Spatial filter</h3>', '      <VisualEncodingControls dimensions={queryDimensions} settings={visualEncoding} onChange={setVisualEncoding} />\n      <section className="toolbar-section"><h3>Spatial filter</h3>', 'visual controls')
          app = replace_once(app, '        widthPx={tab.style.heatEnabled ? lineWidths.heat : lineWidths.route}\n', '        widthPx={heatActive ? lineWidths.heat : lineWidths.route}\n', 'terrain width')
          app_path.write_text(app)

          contracts_path = Path("apps/web/src/contracts.ts")
          contracts = contracts_path.read_text()
          contracts = replace_once(contracts, 'export type RenderPlan = { type: "arrow"; activityIds: string[] };\nexport type QueryResult = { queryId: string; selectedCount: number; renderPlan: RenderPlan };\n', 'export type QueryScalar = string | number | null;\nexport type QueryDimension = { name: string; kind: "categorical" | "numeric" | "temporal"; values: Record<string, QueryScalar>; steps: (string | number)[]; domain?: [number, number] };\nexport type RenderPlan = { type: "arrow"; activityIds: string[] };\nexport type QueryResult = { queryId: string; selectedCount: number; renderPlan: RenderPlan; dimensions?: QueryDimension[] };\n', 'query dimension contracts')
          contracts_path.write_text(contracts)
          PY

          git add apps/web/src/App.tsx apps/web/src/contracts.ts
          rm -f .github/workflows/sync-animation-main.yml
          git add -A
          if [ "$merge_status" -ne 0 ] && git diff --name-only --diff-filter=U | grep -q .; then
            echo "Merge still has unresolved conflicts"
            git diff --name-only --diff-filter=U
            exit 1
          fi
      - run: pnpm --filter @squiggles/web typecheck
      - run: pnpm --filter @squiggles/web test
      - run: pnpm --filter @squiggles/web lint
      - name: Commit and push sync
        shell: bash
        run: |
          git status --short
          git commit -m 'chore: sync animation PR with main'
          git push origin HEAD:feature/query-visual-dimensions
