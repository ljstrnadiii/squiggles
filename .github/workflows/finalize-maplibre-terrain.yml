name: Finalize MapLibre terrain integration
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply final terrain integration cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          heat = Path('apps/web/src/heat.ts')
          text = heat.read_text()
          text = text.replace('''function terrainExperiment() {\n  return typeof window !== "undefined" && new URLSearchParams(window.location.search).get("terrain") === "1";\n}\n\nfunction heatCell(longitude: number, latitude: number, view: MapState, width: number, height: number, worldSize: number, cellPixels: number): Cell | null {\n''', '''function heatCell(longitude: number, latitude: number, view: MapState, width: number, height: number, worldSize: number, cellPixels: number, skipViewportClip = false): Cell | null {\n''')
          text = text.replace('''  if (!terrainExperiment() && !visibleWorldPoint(point, view, width, height, worldSize, cellPixels)) return null;''', '''  if (!skipViewportClip && !visibleWorldPoint(point, view, width, height, worldSize, cellPixels)) return null;''')
          text = text.replace('''  sliceBudgetMs = 8,\n): Promise<CooperativeHeatResult | null> {''', '''  sliceBudgetMs = 8,\n  skipViewportClip = false,\n): Promise<CooperativeHeatResult | null> {''')
          cooperative = '''          const cell = heatCell(longitude, latitude, view, width, height, worldSize, cellPixels);'''
          positions = []
          start = 0
          while True:
            i = text.find(cooperative, start)
            if i < 0: break
            positions.append(i)
            start = i + 1
          if positions:
            i = positions[-1]
            text = text[:i] + cooperative.replace(');', ', skipViewportClip);') + text[i + len(cooperative):]
          heat.write_text(text)

          app = Path('apps/web/src/App.tsx')
          text = app.read_text()
          text = text.replace('''      systemResolution === "low" ? 4 : 8,\n    ).then''', '''      systemResolution === "low" ? 4 : 8,\n      terrainEnabled,\n    ).then''')
          text = text.replace('''[hover, hoverPathData, isolateSelected, lineWidths, openActivity, overviewBatches, overviewPathData, pickingPathData, profileHover, routeBatches, selected, selectedSegments, spatialDraft, spatialDrawing, tab.spatialFilter, tab.style.color, tab.style.heatEnabled]''', '''[engine, hover, hoverPathData, isolateSelected, lineWidths, openActivity, overviewBatches, overviewPathData, pickingPathData, profileHover, routeBatches, selected, selectedSegments, spatialDraft, spatialDrawing, tab.spatialFilter, tab.style.color, tab.style.heatEnabled]''')
          app.write_text(text)

          terrain = Path('apps/web/src/MapLibreTerrainRoutes.tsx')
          text = terrain.read_text()
          text = text.replace('''    map.on("load", addLayers); map.on("style.load", addLayers);''', '''    const load = () => { addLayers(); callbacks.current.onView(cameraSnapshot(map)); };\n    map.on("load", load); map.on("style.load", addLayers);''')
          terrain.write_text(text)
          PY
          if git diff --quiet -- apps/web/src/App.tsx apps/web/src/heat.ts apps/web/src/MapLibreTerrainRoutes.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/heat.ts apps/web/src/MapLibreTerrainRoutes.tsx
          git commit -m "fix: finalize saved 3D terrain behavior"
          git push
