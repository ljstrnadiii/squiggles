name: Patch visual persistence

on:
  push:
    branches:
      - feature/persist-visual-encoding-custom-heat

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/persist-visual-encoding-custom-heat
          fetch-depth: 0
      - run: python .github/scripts/patch_visual_persistence.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src
          git commit -m "feat: persist visual settings and customize heat colors"
          git push origin HEAD:feature/persist-visual-encoding-custom-heat
