name: Patch rebuild progress
on:
  push:
    branches: [fix/rebuild-progress-overlay]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/rebuild-progress-overlay
      - name: Apply rebuild progress overlay
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('infra/aws/control-plane.mjs')
          text = p.read_text()

          marker = '''async function profilesForStatus(status) {'''
          helper = '''async function activeDatasetBuild(datasetId) {\n  const page = await dynamo.send(new QueryCommand({ TableName: tableName, KeyConditionExpression: "PK = :pk AND begins_with(SK, :build)", ExpressionAttributeValues: { ":pk": { S: `DATASET#${datasetId}` }, ":build": { S: "BUILD#" } } }));\n  return (page.Items ?? [])\n    .filter(item => !["ready", "failed"].includes(item.status?.S ?? ""))\n    .sort((a, b) => (b.updatedAt?.S ?? "").localeCompare(a.updatedAt?.S ?? ""))[0] ?? null;\n}\n\nasync function uploadView(item) {\n  const id = item.SK.S.slice(7);\n  const rebuild = await activeDatasetBuild(id);\n  const progress = rebuild ?? item;\n  return {\n    id,\n    filename: item.filename?.S ?? "",\n    byteSize: Number(item.byteSize?.N ?? 0),\n    status: progress.status?.S ?? item.status?.S ?? "",\n    statusDetail: progress.statusDetail?.S ?? item.statusDetail?.S ?? "",\n    progressCompleted: Number(progress.progressCompleted?.N ?? 0),\n    progressTotal: Number(progress.progressTotal?.N ?? 0),\n    createdAt: item.createdAt?.S ?? "",\n  };\n}\n\n'''
          if marker not in text: raise SystemExit('profiles marker missing')
          text = text.replace(marker, helper + marker, 1)

          old = '''  if (route === "GET /api/uploads") {\n    const result = await dynamo.send(new QueryCommand({ TableName: tableName, KeyConditionExpression: "PK = :pk AND begins_with(SK, :upload)", ExpressionAttributeValues: { ":pk": key.PK, ":upload": { S: "UPLOAD#" } }, ScanIndexForward: false }));\n    return response(200, { uploads: (result.Items ?? []).map(item => ({ id: item.SK.S.slice(7), filename: item.filename.S, byteSize: Number(item.byteSize.N), status: item.status.S, statusDetail: item.statusDetail?.S ?? "", progressCompleted: Number(item.progressCompleted?.N ?? 0), progressTotal: Number(item.progressTotal?.N ?? 0), createdAt: item.createdAt.S })) });\n  }'''
          new = '''  if (route === "GET /api/uploads") {\n    const result = await dynamo.send(new QueryCommand({ TableName: tableName, KeyConditionExpression: "PK = :pk AND begins_with(SK, :upload)", ExpressionAttributeValues: { ":pk": key.PK, ":upload": { S: "UPLOAD#" } }, ScanIndexForward: false }));\n    return response(200, { uploads: await Promise.all((result.Items ?? []).map(uploadView)) });\n  }'''
          if old not in text: raise SystemExit('uploads route marker missing')
          text = text.replace(old, new, 1)

          old = '''  const latestUpload = uploads[0];\n  return response(200, {'''
          new = '''  const latestUpload = uploads[0];\n  const latestCompile = latestUpload ? await uploadView(latestUpload) : null;\n  return response(200, {'''
          if old not in text: raise SystemExit('latest upload marker missing')
          text = text.replace(old, new, 1)

          old = '''    compile: latestUpload ? {\n      filename: latestUpload.filename?.S ?? "",\n      status: latestUpload.status?.S ?? "",\n      statusDetail: latestUpload.statusDetail?.S ?? "",\n      progressCompleted: Number(latestUpload.progressCompleted?.N ?? 0),\n      progressTotal: Number(latestUpload.progressTotal?.N ?? 0),\n    } : null,'''
          new = '''    compile: latestCompile ? {\n      filename: latestCompile.filename,\n      status: latestCompile.status,\n      statusDetail: latestCompile.statusDetail,\n      progressCompleted: latestCompile.progressCompleted,\n      progressTotal: latestCompile.progressTotal,\n    } : null,'''
          if old not in text: raise SystemExit('compile response marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add infra/aws/control-plane.mjs
          git commit -m 'fix: expose active rebuild progress in profiles'
          git push
