name: Migrate MapLibre App tests
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update stale Mapbox-era App expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/App.test.tsx')
          text = path.read_text()
          text = text.replace(
              'vi.mock("maplibre-gl", () => ({ Map: class { jumpTo() {} setStyle() {} remove() {} } }));',
              '''vi.mock("maplibre-gl", () => ({ Map: class {\n  handlers = new Map<string, ((...args: unknown[]) => void)[]>();\n  on(name: string, handler: (...args: unknown[]) => void) { this.handlers.set(name, [...(this.handlers.get(name) ?? []), handler]); if (name === "load") handler(); return this; }\n  getCenter() { return { lng: -106.25, lat: 39.5 }; }\n  getBounds() { return { getWest: () => -107, getSouth: () => 38, getEast: () => -105, getNorth: () => 41 }; }\n  getCanvas() { return { clientWidth: 1200, clientHeight: 800, style: { cursor: "" } }; }\n  getZoom() { return 9.25; }\n  getLayer() { return undefined; }\n  addLayer() {}\n  jumpTo() {}\n  setStyle() {}\n  setTerrain() {}\n  remove() {}\n} }));'''
          )
          text = text.replace('toHaveValue("mapbox-standard")', 'toHaveValue("streets")')
          text = text.replace('getByRole("option", { name: "Mapbox Satellite" })', 'getByRole("option", { name: "Imagery" })')
          text = text.replace('{ target: { value: "mapbox-outdoors" } }', '{ target: { value: "topo" } }')
          text = text.replace('searchParams.get("basemap")).toBe("mapbox-outdoors")', 'searchParams.get("basemap")).toBe("topo")')
          text = text.replace('    expect(new URL(window.location.href).searchParams.get("bearing")).toBe("31.5");\n', '')
          text = text.replace('    expect(new URL(window.location.href).searchParams.get("pitch")).toBe("47.0");\n', '')
          text = text.replace('mapState: { longitude: number; latitude: number; zoom: number; bearing: number; pitch: number }', 'mapState: { longitude: number; latitude: number; zoom: number }')
          text = text.replace('mapState: { longitude: -106.25, latitude: 39.5, zoom: 11.25, bearing: -22, pitch: 43.5 }', 'mapState: { longitude: -106.25, latitude: 39.5, zoom: 11.25 }')
          path.write_text(text)
          PY
          if git diff --quiet -- apps/web/src/App.test.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.test.tsx
          git commit -m "test: migrate App expectations to MapLibre terrain"
          git push
