name: Patch account and progress
on:
  push:
    branches: [fix/account-session-compile-progress]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/account-session-compile-progress
      - name: Apply account and progress fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); t=p.read_text()
              if old not in t: raise SystemExit(f'missing marker: {path}: {old[:100]!r}')
              p.write_text(t.replace(old,new,1))

          # Persist the auth session across reloads/new tabs while keeping PKCE state tab-scoped.
          replace('apps/web/src/auth.ts',
            'export function loadSession(): AuthSession | null {\n  try { return JSON.parse(sessionStorage.getItem(sessionKey) ?? "null") as AuthSession | null; }\n  catch { return null; }\n}\n\nexport function clearSession() { sessionStorage.removeItem(sessionKey); }',
            'export function loadSession(): AuthSession | null {\n  try {\n    const stored = localStorage.getItem(sessionKey) ?? sessionStorage.getItem(sessionKey);\n    const session = JSON.parse(stored ?? "null") as AuthSession | null;\n    if (session && !localStorage.getItem(sessionKey)) localStorage.setItem(sessionKey, JSON.stringify(session));\n    return session;\n  } catch { return null; }\n}\n\nexport function clearSession() { localStorage.removeItem(sessionKey); sessionStorage.removeItem(sessionKey); }')
          t=Path('apps/web/src/auth.ts').read_text().replace('sessionStorage.setItem(sessionKey, JSON.stringify(session));','localStorage.setItem(sessionKey, JSON.stringify(session));')
          Path('apps/web/src/auth.ts').write_text(t)

          # Keep login UI terse and avoid flashing session-checking copy.
          replace('apps/web/src/AccountPanel.tsx',
            'profile?.name || profile?.email : "Make Squiggles yours"',
            'profile?.name || profile?.email : "Log in"')
          replace('apps/web/src/AccountPanel.tsx',
            '    {loading && <p>Checking your session…</p>}\n',
            '')
          replace('apps/web/src/AccountPanel.tsx',
            '<p>An account lets Squiggles compile your activity archive, keep maps available across devices, publish a stable link, and count views. Strava exports are currently supported.</p>',
            '<p>Upload and manage your activity archive.</p>')

          # Report progress for derived render-pyramid rebuilds one LOD at a time.
          p=Path('packages/ingest/src/activity_map_ingest/geoparquet_sink.py'); t=p.read_text()
          t=t.replace('from collections.abc import Iterable','from collections.abc import Callable, Iterable',1)
          t=t.replace('def write_render_pyramid(table: pa.Table, path: Path) -> list[ShardMetadata]:',
                      'def write_render_pyramid(\n    table: pa.Table, path: Path, progress_callback: Callable[[int, int], None] | None = None\n) -> list[ShardMetadata]:',1)
          marker='''        levels.append(\n            {\n                "lod": lod,'''
          replacement='''        levels.append(\n            {\n                "lod": lod,'''
          # Add callback after each level is fully written.
          tail='''                "row_groups": row_groups,\n            }\n        )\n    return levels'''
          newtail='''                "row_groups": row_groups,\n            }\n        )\n        if progress_callback:\n            progress_callback(lod + 1, len(RENDER_TOLERANCES_M))\n    return levels'''
          if tail not in t: raise SystemExit('missing render pyramid tail')
          p.write_text(t.replace(tail,newtail,1))

          p=Path('packages/ingest/src/activity_map_ingest/dataset_builds.py'); t=p.read_text()
          t=t.replace('from typing import Any','from collections.abc import Callable\nfrom typing import Any',1)
          t=t.replace('def rebuild_derived_dataset(source: Path, output: Path) -> dict[str, Any]:',
                      'def rebuild_derived_dataset(\n    source: Path, output: Path, progress_callback: Callable[[int, int], None] | None = None\n) -> dict[str, Any]:',1)
          t=t.replace('render_levels = write_render_pyramid(pa.concat_tables(tables), output / "render")',
                      'render_levels = write_render_pyramid(\n        pa.concat_tables(tables), output / "render", progress_callback=progress_callback\n    )',1)
          p.write_text(t)

          replace('packages/ingest/src/activity_map_ingest/cloud_job.py',
            '                rebuild_derived_dataset(source, output)',
            '                rebuild_derived_dataset(\n                    source,\n                    output,\n                    progress_callback=lambda completed, total: status(\n                        "compiling",\n                        f"Render level {completed:,} of {total:,} · {completed / total:.0%}",\n                        completed,\n                        total,\n                    ),\n                )')

          # Tests: persistent session storage and derived progress callback.
          p=Path('apps/web/src/auth.test.ts'); t=p.read_text()
          t=t.replace('sessionStorage.clear();', 'sessionStorage.clear(); localStorage.clear();')
          p.write_text(t)

          p=Path('packages/ingest/tests/test_ingest.py'); t=p.read_text()
          old='''    rebuilt = rebuild_derived_dataset(output, rebuilt_path)'''
          new='''    rebuild_progress: list[tuple[int, int]] = []\n    rebuilt = rebuild_derived_dataset(\n        output, rebuilt_path, progress_callback=lambda completed, total: rebuild_progress.append((completed, total))\n    )\n    assert rebuild_progress[-1] == (8, 8)'''
          if old not in t: raise SystemExit('missing rebuild test marker')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Format Python
        run: |
          pip install ruff==0.16.4
          ruff format packages/ingest/src/activity_map_ingest/geoparquet_sink.py packages/ingest/src/activity_map_ingest/dataset_builds.py packages/ingest/src/activity_map_ingest/cloud_job.py packages/ingest/tests/test_ingest.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/auth.ts apps/web/src/auth.test.ts apps/web/src/AccountPanel.tsx packages/ingest/src/activity_map_ingest/geoparquet_sink.py packages/ingest/src/activity_map_ingest/dataset_builds.py packages/ingest/src/activity_map_ingest/cloud_job.py packages/ingest/tests/test_ingest.py
          git commit -m 'fix: persist sessions and report compile progress'
          git push
