<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>MapLibre binary terrain spike</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css" />
  <style>
    html,body,#map,#deck{position:absolute;inset:0;margin:0;width:100%;height:100%;overflow:hidden}
    #deck{pointer-events:auto}
    #hud{position:absolute;z-index:10;left:12px;top:12px;max-width:420px;padding:10px 12px;border-radius:8px;background:rgba(10,15,18,.86);color:#fff;font:13px/1.35 system-ui,sans-serif}
    #hud strong{display:block;margin-bottom:4px}
    #hud code{font-size:12px}
    #status.error{color:#ff9b9b}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="deck"></div>
  <div id="hud"><strong>MapLibre + deck binary terrain spike</strong><span id="status">loading modules…</span><br><small>Drag/zoom/pitch. Routes are binary PathLayers with TerrainExtension; MapLibre draws the terrain underneath.</small></div>
  <script>
    window.addEventListener('error', event => {
      const status = document.getElementById('status');
      if (status) {
        status.className = 'error';
        status.textContent = `startup error: ${event.message || 'unknown error'}`;
      }
    });
    window.addEventListener('unhandledrejection', event => {
      const status = document.getElementById('status');
      if (status) {
        status.className = 'error';
        status.textContent = `startup error: ${event.reason?.message || event.reason || 'unhandled rejection'}`;
      }
    });
  </script>
  <script type="module">
    import maplibregl from 'https://esm.sh/maplibre-gl@6.7.0';
    import {Deck, MapView} from 'https://esm.sh/@deck.gl/core@9.4.1';
    import {PathLayer} from 'https://esm.sh/@deck.gl/layers@9.4.1';
    import {TerrainLayer} from 'https://esm.sh/@deck.gl/geo-layers@9.4.1';
    import {_TerrainExtension as TerrainExtension} from 'https://esm.sh/@deck.gl/extensions@9.4.1';

    const status = document.getElementById('status');
    status.textContent = 'modules loaded · initializing terrain…';

    const DEM = 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
    const decoder = {rScaler: 256, gScaler: 1, bScaler: 1 / 256, offset: -32768};
    const initialViewState = {longitude: -105.292, latitude: 39.985, zoom: 12.2, bearing: -24, pitch: 62};

    const style = {
      version: 8,
      sources: {
        base: {
          type: 'raster',
          tiles: ['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '© OpenStreetMap contributors © CARTO'
        },
        terrain: {
          type: 'raster-dem',
          tiles: [DEM],
          tileSize: 256,
          maxzoom: 14,
          encoding: 'terrarium'
        }
      },
      layers: [{id: 'base', type: 'raster', source: 'base'}],
      terrain: {source: 'terrain', exaggeration: 1}
    };

    const map = new maplibregl.Map({
      container: 'map',
      style,
      ...initialViewState,
      interactive: false,
      attributionControl: false,
      canvasContextAttributes: {antialias: true}
    });

    const positions = new Float64Array([
      -105.3105,39.9780, -105.3065,39.9800, -105.3020,39.9830, -105.2980,39.9860,
      -105.2940,39.9890, -105.2895,39.9910, -105.2850,39.9920, -105.2810,39.9910,
      -105.3098,39.9785, -105.3058,39.9805, -105.3015,39.9835, -105.2975,39.9865,
      -105.2935,39.9895, -105.2890,39.9915, -105.2845,39.9925, -105.2805,39.9915
    ]);
    const startIndices = new Uint32Array([0, 8, 16]);
    const colors = new Uint8Array(16 * 4);
    for (let i = 0; i < 8; i++) colors.set([255, 62, 82, 235], i * 4);
    for (let i = 8; i < 16; i++) colors.set([40, 160, 255, 235], i * 4);
    const binary = {
      length: 2,
      startIndices,
      attributes: {
        getPath: {value: positions, size: 2},
        getColor: {value: colors, size: 4}
      }
    };

    const terrain = new TerrainLayer({
      id: 'deck-terrain-source',
      elevationData: DEM,
      elevationDecoder: decoder,
      minZoom: 0,
      maxZoom: 14,
      strategy: 'no-overlap',
      operation: 'terrain'
    });
    const extension = new TerrainExtension();
    const routes = new PathLayer({
      id: 'binary-routes',
      data: binary,
      _pathType: 'open',
      positionFormat: 'XY',
      getWidth: 4,
      widthUnits: 'pixels',
      widthMinPixels: 2,
      pickable: true,
      antialiasing: true,
      extensions: [extension],
      terrainDrawMode: 'drape'
    });

    const deck = new Deck({
      parent: document.getElementById('deck'),
      views: new MapView({repeat: true}),
      controller: true,
      initialViewState,
      layers: [terrain, routes],
      onViewStateChange: ({viewState}) => {
        map.jumpTo({
          center: [viewState.longitude, viewState.latitude],
          zoom: viewState.zoom,
          bearing: viewState.bearing,
          pitch: viewState.pitch
        });
      },
      getTooltip: ({index}) => index >= 0 ? `binary route ${index + 1}` : null,
      onAfterRender: () => {
        status.className = '';
        status.textContent = `ready · ${positions.length / 2} binary vertices · no GeoJSON`;
      }
    });

    window.__terrainSpike = {map, deck, positions, startIndices, colors};
  </script>
</body>
</html>
