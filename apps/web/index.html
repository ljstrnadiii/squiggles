<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><meta name="theme-color" content="#0d1715" /><link rel="icon" type="image/png" href="/logo-light.png" /><link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet" /><style>.view-mode-control{display:flex;width:100%;gap:4px}.view-mode-control button{flex:1;min-height:34px}.view-mode-control button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}#three-d-coming-soon{max-width:420px;border:1px solid var(--border);border-radius:14px;background:var(--panel);color:var(--text);padding:20px;box-shadow:0 18px 60px #0008}#three-d-coming-soon::backdrop{background:#0008}#three-d-coming-soon h2{margin:0 0 8px;font-size:1.1rem}#three-d-coming-soon p{margin:0 0 16px;line-height:1.45;color:var(--muted)}#three-d-coming-soon button{min-width:92px}</style><title>Squiggles</title></head><body><div id="root"></div><dialog id="three-d-coming-soon"><h2>3D map view is in progress</h2><p>We're working on terrain-correct route rendering that keeps heat colors and route inspection fast and reliable. For now, Squiggles stays in 2D.</p><form method="dialog"><button>Got it</button></form></dialog><script>(()=>{const url=new URL(window.location.href);if(url.searchParams.get('view')==='3d'){url.searchParams.set('view','2d');url.searchParams.set('pitch','0');url.searchParams.set('bearing','0');history.replaceState({},'',url)}const dialog=()=>document.getElementById('three-d-coming-soon');document.addEventListener('click',event=>{const target=event.target instanceof Element?event.target.closest('button[aria-label="Use 3D map view"]'):null;if(!target)return;event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();const modal=dialog();if(modal instanceof HTMLDialogElement&&!modal.open)modal.showModal()},true);const mark=()=>{const button=document.querySelector('button[aria-label="Use 3D map view"]');if(button&&!button.dataset.comingSoon){button.dataset.comingSoon='true';button.textContent='3D · Soon'}};new MutationObserver(mark).observe(document.documentElement,{childList:true,subtree:true});mark()})();</script><script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script><script type="module" src="/src/main.tsx"></script></body></html>
