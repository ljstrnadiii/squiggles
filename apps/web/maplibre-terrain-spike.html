<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>MapLibre binary terrain spike</title>
  <style>
    html,body,#map,#deck{position:absolute;inset:0;margin:0;width:100%;height:100%;overflow:hidden}
    #deck{pointer-events:auto}
    #hud{position:absolute;z-index:10;left:12px;top:12px;max-width:420px;padding:10px 12px;border-radius:8px;background:rgba(10,15,18,.86);color:#fff;font:13px/1.35 system-ui,sans-serif}
    #hud strong{display:block;margin-bottom:4px}
    #status.error{color:#ff9b9b}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="deck"></div>
  <div id="hud"><strong>MapLibre + deck binary terrain spike</strong><span id="status">starting local bundle…</span><br><small>Drag/zoom/pitch. Routes are binary PathLayers with TerrainExtension; MapLibre draws the terrain underneath.</small></div>
  <script type="module" src="/src/maplibreTerrainSpike.ts"></script>
</body>
</html>
